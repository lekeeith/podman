# .github/workflows/build-x86.yml
name: Build x86_64 Podman Binary

on:
  push:
    branches: [ main ]  # 或你希望触发的分支
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest  # 默认是 x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'  # 根据 Podman 当前要求调整

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdevmapper-dev \
            libgpgme-dev \
            libbtrfs-dev \
            libseccomp-dev \
            btrfs-progs \
            pkg-config

      - name: Build podman binary
        run: |
          make bin/podman

      - name: Verify binary
        run: |
          file bin/podman
          ./bin/podman --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: podman-x86_64-linux
          path: bin/podman
